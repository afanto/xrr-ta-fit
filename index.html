<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ta thickness fit</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Ta thickness fit</h1>
  <button id="theme" class="ghost" title="Light / dark" aria-label="Toggle light or dark">◐</button>
</header>

<main>
  <section class="controls">
    <div class="panel">
      <div class="steprow"><span class="step">1</span><h2>Scan</h2></div>
      <label class="drop" id="drop">
        <input type="file" id="file" accept=".xrdml,.txt,.dat,.csv,.xy,.asc" hidden>
        <strong id="dropText">Drop your .xrdml here</strong>
        <span>or click to choose a file</span>
      </label>
    </div>

    <div class="panel">
      <div class="steprow"><span class="step">2</span><h2>Ta deposition</h2></div>
      <div class="grid2">
        <label>Power (W)<input id="power" type="number" min="1" max="500" step="any" inputmode="decimal" placeholder="e.g. 150"></label>
        <label>Time (s)<input id="time" type="number" min="1" max="100000" step="any" inputmode="decimal" placeholder="e.g. 310"></label>
      </div>
      <div class="stack" aria-label="Layer stack">
        <div class="lay cap"><b>Ru</b> cap <i>21.4 Å, locked</i></div>
        <div class="lay ta"><b>Ta</b> <i>fitted</i></div>
        <div class="lay cap"><b>Ru</b> seed <i>21.4 Å, locked</i></div>
        <div class="lay sub">glass substrate</div>
      </div>
    </div>

    <button id="run" class="primary" disabled>Fit</button>
    <div id="progress" class="progress" hidden>
      <div class="bar"><div id="barfill"></div></div>
      <span id="progText"></span>
    </div>
    <div id="error" class="error" hidden></div>
  </section>

  <section class="results">
    <div class="panel">
      <h2>Reflectivity</h2>
      <p id="empty" class="hint">Choose a scan to see it here.</p>
      <div class="canvaswrap tall"><canvas id="cvMain"></canvas></div>
      <div class="canvaswrap short" id="residWrap" hidden><canvas id="cvResid"></canvas></div>
    </div>
    <div id="resultPanel" class="panel" hidden>
      <h2>Result</h2>
      <div class="cards">
        <div class="card big"><div class="k">Ta thickness</div><div class="v" id="rThick">–</div><div class="x2" id="rThickNm"></div></div>
        <div class="card"><div class="k">Deposition rate</div><div class="v" id="rRate">–</div><div class="x2" id="rRateW"></div></div>
        <div class="card"><div class="k">Fit quality</div><div class="v" id="rChi">–</div><div class="x2" id="rRange"></div></div>
      </div>
      <div id="notes"></div>
      <div class="actions"><button id="csv" class="ghost">Download fit (CSV)</button></div>
    </div>
  </section>
</main>

<script src="plot.js"></script>
<script src="app.js"></script>
</body>
</html>
